# ---------------------------------------------------------------------------
# SIPLAD — Nginx balanceador de carga
#
# Es el unico punto de entrada del sistema. Reparte el trafico de la API entre
# las replicas del backend y entrega el frontend para todo lo demas.
# ---------------------------------------------------------------------------

# --- Grupo de servidores de aplicacion -------------------------------------
# El algoritmo por omision de Nginx es round-robin: reparte las peticiones por
# turnos entre las instancias disponibles. Se eligio asi porque el backend es
# sin estado —la sesion viaja en el token, no en memoria del servidor—, de
# modo que cualquier replica puede atender cualquier peticion.
#
# 'max_fails' y 'fail_timeout' dan tolerancia a fallos: si una replica falla
# tres veces en treinta segundos, el balanceador deja de enviarle trafico y lo
# reintenta despues. El servicio sigue en pie con la replica restante.
upstream aplicacion {
    server backend-1:3000 max_fails=3 fail_timeout=30s;
    server backend-2:3000 max_fails=3 fail_timeout=30s;

    # Conexiones persistentes hacia el backend: evita abrir una conexion TCP
    # nueva en cada peticion.
    keepalive 32;
}

upstream interfaz {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Tamano maximo de subida, alineado con el limite de 5 MB que valida el
    # backend para las constancias y para el documento de la planeacion.
    client_max_body_size 6M;

    # Cabeceras de seguridad (OWASP A05).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API: repartida entre las replicas ---------------------------------
    location /api/ {
        proxy_pass http://aplicacion;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Sin estas cabeceras el backend veria todas las peticiones como
        # provenientes del balanceador y perderia la direccion real del
        # cliente, que es lo que se registra en la bitacora.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si una replica no responde, la peticion se reintenta en la otra en
        # lugar de devolverle un error al usuario.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        # Devuelve que instancia atendio la peticion. Es lo que permite
        # demostrar el balanceo: al recargar, el valor cambia.
        add_header X-Instancia-Backend $upstream_addr always;
    }

    # --- Archivos subidos en modo local ------------------------------------
    location /uploads/ {
        proxy_pass http://aplicacion;
        proxy_set_header Host $host;
    }

    # --- Todo lo demas: la interfaz ----------------------------------------
    location / {
        proxy_pass http://interfaz;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
