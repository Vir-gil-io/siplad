# ---------------------------------------------------------------------------
# SIPLAD — Nginx del contenedor del frontend
#
# Sirve la aplicacion compilada. Lo unico delicado es la ultima regla: una
# aplicacion de pagina unica maneja su propio enrutado, asi que cualquier ruta
# que no corresponda a un archivo real debe devolver index.html para que React
# Router resuelva la navegacion. Sin eso, recargar en /reportes da 404.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion de los archivos de texto: reduce la descarga inicial.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad (OWASP A05).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Los archivos con huella en el nombre nunca cambian de contenido, asi que
    # pueden cachearse de forma indefinida.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El documento principal no se cachea: es lo que apunta a la version nueva
    # de los archivos tras cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Enrutado del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
